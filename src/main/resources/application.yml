openapi:
  name: ${spring.application.name}
  title: Mina ärenden – producent med ärendecache
  version: '@project.version@'
  description: >-
    Producent enligt Mina ärendens standard för samlad ärendeåterkoppling. Kundhändelser lagras i en ärendecache
    (MariaDB) och lämnas ut via samma operation som Skatteverkets vidareförmedlingstjänst använder:
    POST /{municipalityId}/kundhandelseFragaSynkron. Alla anrop kräver API-nyckel i headern X-API-Key.
spring:
  application:
    name: api-activity-feed
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://localhost:3306/activityfeed}
    username: ${DB_USER:activityfeed}
    password: ${DB_PASSWORD:activityfeed}
  flyway:
    # Flyway owns the schema (src/main/resources/db/migration). Migrations run forward on every start, never clean,
    # so a redeploy never empties the database.
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      jakarta:
        persistence:
          schema-generation:
            database:
              # Hibernate may only validate the schema, never change it.
              action: validate
management:
  endpoint:
    health:
      probes:
        enabled: true
# Payload logging, actuator exposure and health details are set by SecurityDefaultsEnvironmentPostProcessor,
# because dept44's defaults would otherwise take precedence over this file.
logbook:
  body-filters:
    # If payload logging is turned on anyway, personal identity numbers in queries and ingest are masked.
    json-path:
      - key: '$.anvandare'
        value: '************'
      - key: '$..identifierare'
        value: '************'
security:
  api-key:
    header-name: X-API-Key
    # Comma-separated lists. At least one key is required, otherwise the service does not start. See README (Security).
    query-keys: ${API_KEYS_QUERY:}
    admin-keys: ${API_KEYS_ADMIN:${ADMIN_API_KEY:}}
activity-feed:
  standard-version: ${ACTIVITY_FEED_STANDARD_VERSION:6.1}
  # Load sample activities at startup for municipalities without activities (development and demo only).
  seed: ${ACTIVITY_FEED_SEED:false}
  producers:
    - municipality-id: ${ACTIVITY_FEED_MUNICIPALITY_ID:2281}
      name: ${ACTIVITY_FEED_PRODUCER_NAME:Referenskommunen}
      prefix: ${ACTIVITY_FEED_PREFIX:REFKOM}
