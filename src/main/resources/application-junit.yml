spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6.14:///activityfeed
  jpa:
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          schema-generation:
            script:
              append: false
      jakarta:
        persistence:
          schema-generation:
            create-source: metadata
            database:
              action: validate
            scripts:
              action: create
              create-target: target/database/generated-schema.sql
activity-feed:
  standard-version: '6.1'
  seed: false
  producers:
    - municipality-id: '2281'
      name: Testköpings kommun
      prefix: TESTKOP
    - municipality-id: '2262'
      name: Timrå kommun
      prefix: TIMRA
