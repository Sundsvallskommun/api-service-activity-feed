# The service with an internal MariaDB, for Dokploy (Compose service) and local use.
#
# The data lives in the mariadb-data volume and survives redeploys, restarts and new versions. On every deploy
# db-prepare runs first. It takes a backup (the mariadb-backups volume) and syncs the database password before app
# starts and Flyway migrates the schema forward. The database is not published outside the Compose network.
#
# Never remove the volumes (docker compose down -v, or "Delete volumes" in Dokploy) if the data must be kept.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/activityfeed
      DB_USER: activityfeed
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      API_KEYS_QUERY: ${API_KEYS_QUERY:-}
      # Without a valid key the service refuses to start (see README). ADMIN_API_KEY is read so that older deploys keep working.
      API_KEYS_ADMIN: ${API_KEYS_ADMIN:-${ADMIN_API_KEY:-}}
      ACTIVITY_FEED_MUNICIPALITY_ID: ${ACTIVITY_FEED_MUNICIPALITY_ID:-2281}
      ACTIVITY_FEED_PRODUCER_NAME: ${ACTIVITY_FEED_PRODUCER_NAME:-Referenskommunen}
      ACTIVITY_FEED_PREFIX: ${ACTIVITY_FEED_PREFIX:-REFKOM}
      ACTIVITY_FEED_STANDARD_VERSION: ${ACTIVITY_FEED_STANDARD_VERSION:-6.1}
      ACTIVITY_FEED_SEED: ${ACTIVITY_FEED_SEED:-false}
      TZ: Europe/Stockholm
    depends_on:
      db:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    # Gives ongoing requests time to finish (graceful shutdown) before the container is replaced.
    stop_grace_period: 30s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: activityfeed
      MARIADB_USER: activityfeed
      # Only read when the volume is initialised (first deploy). db-prepare handles later changes of DB_PASSWORD.
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # As in earlier versions: without DB_ROOT_PASSWORD the root password is the same as DB_PASSWORD.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: UTC
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Gives InnoDB time to shut down cleanly on redeploy.
    stop_grace_period: 60s

  db-prepare:
    build:
      context: docker/db-prepare
    restart: "no"
    environment:
      DB_HOST: db
      DB_NAME: activityfeed
      DB_USER: activityfeed
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-10}
    volumes:
      - mariadb-backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb-data:
  mariadb-backups:
