name: "Docker and redeploy"

# Builds the container with docker/Dockerfile through docker-compose.yml (as Dokploy does) and verifies that a redeploy
# with a new build and a changed database password keeps the data. See docker/redeploy-test.sh.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  redeploy:
    name: Build and verify redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run redeploy test
        run: ./docker/redeploy-test.sh
